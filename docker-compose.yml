services:
  postgres:
    image: postgres:16
    container_name: postgres_estoque
    restart: always
    environment:
      POSTGRES_DB: estoque_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5439:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - estoque_network

  api:
    build: .
    container_name: estoque_api
    restart: always
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/estoque_db
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:8080"
    networks:
      - estoque_network

volumes:
  postgres_data:

networks:
  estoque_network:
    driver: bridge
